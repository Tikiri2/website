<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <title>Customize your fit — VENU Shoues</title>
    <meta name="description" content="Choose your shoe size, heel height and colour, then order your custom pair on WhatsApp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <header class="custom-header">
      <a class="custom-brand" href="index.html#home" aria-label="VENU Shoues home">
        <span class="brand-badge" aria-hidden="true">V</span>
        <span>VENU <span class="brand-accent">Shoues</span></span>
      </a>
      <button class="header-shop-button" id="back-to-shop" type="button">Back to shop</button>
    </header>

    <main class="customizer">
      <section class="preview-panel" aria-label="Selected shoe preview">
        <div class="preview-frame">
          <img id="preview-image" src="Backend/assets/heel-golden-hour.jpg" alt="" />
          <span class="preview-tint" id="preview-tint" aria-hidden="true"></span>
          <div class="preview-badge" id="preview-colour">Colour</div>
        </div>
      </section>

      <section class="fit-panel" aria-labelledby="product-name">
        <div class="fit-intro">
          <p class="eyebrow"><span></span>Customize your fit</p>
          <h1 id="product-name">Loading…</h1>
          <p class="product-price" id="product-price"></p>
          <p class="product-desc" id="product-desc"></p>
        </div>

        <div class="fit-controls">
          <div class="fit-group">
            <div class="fit-heading">
              <h2>Size</h2>
              <span class="fit-unit">EU size</span>
            </div>
            <div class="stepper" data-stepper="size">
              <label class="stepper-value">
                <input id="size-input" type="number" inputmode="numeric" min="36" max="40" step="1" value="38" aria-label="EU shoe size" />
              </label>
            </div>
            <p class="fit-note" id="size-note">EU 38</p>
          </div>

          <div class="fit-group">
            <div class="fit-heading">
              <h2>Heel Height</h2>
            </div>
            <div class="stepper" data-stepper="heel">
              <label class="stepper-value">
                <input id="heel-input" type="number" inputmode="decimal" min="0" max="12" step="0.5" value="5" aria-label="Heel height in centimetres" />
                <span>cm</span>
              </label>
            </div>
            <p class="fit-note" id="heel-note">Mid heel</p>
          </div>
        </div>

        <section class="colours-panel" aria-labelledby="colours-title">
          <h2 id="colours-title">Colors</h2>
          <div class="colour-list" id="colour-list" role="group" aria-label="Choose a colour"></div>
        </section>

        <form class="order-form" id="order-form" novalidate>
          <p class="fit-summary" id="fit-summary"></p>
          <label class="phone-field">
            <span>Phone number</span>
            <input id="phone-input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX" required />
          </label>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button type="submit" class="button-order" id="order-button">Confirm &amp; Order on WhatsApp</button>
        </form>
      </section>
    </main>

    <script src="cms-config.js"></script>
    <script src="product.js"></script>
  </body>
</html>
