<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <title>Customize your fit — VENU Shoues</title>
    <meta name="description" content="Choose your shoe size, heel height and colour, then order your custom pair on WhatsApp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <header class="custom-header">
      <a class="custom-brand" href="index.html#home" aria-label="VENU Shoues home">
        <span class="brand-badge" aria-hidden="true">V</span>
        <span>VENU <span class="brand-accent">Shoues</span></span>
      </a>
      <button class="header-shop-button" id="back-to-shop" type="button"><span aria-hidden="true">←</span> Back to shop</button>
    </header>

    <main class="customizer">
      <section class="preview-panel" aria-label="Selected shoe preview">
        <div class="preview-frame">
          <img id="preview-image" src="Backend/assets/heel-golden-hour.jpg" alt="" />
          <span class="preview-tint" id="preview-tint" aria-hidden="true"></span>
        </div>
        <div class="fit-controls">
          <div class="fit-group">
            <div class="fit-heading">
              <h2>Your size</h2>
              <span class="fit-unit">EU size</span>
            </div>
            <div class="stepper" data-stepper="size">
              <label class="stepper-value">
                <input id="size-input" type="number" inputmode="numeric" min="36" max="40" step="1" value="38" aria-label="EU shoe size" />
              </label>
            </div>
            <p class="fit-note" id="size-note">EU 38</p>
          </div>

          <div class="fit-group">
            <div class="fit-heading">
              <h2>Heel height</h2>
            </div>
            <div class="stepper" data-stepper="heel">
              <label class="stepper-value">
                <input id="heel-input" type="number" inputmode="decimal" min="0" max="12" step="0.5" value="5" aria-label="Heel height in centimetres" />
                <span>cm</span>
              </label>
            </div>
            <p class="fit-note" id="heel-note">Mid heel</p>
          </div>
        </div>
      </section>

      <section class="fit-panel" aria-labelledby="product-name">
        <div class="fit-intro">
          <p class="eyebrow"><span></span>Make it yours</p>
          <h1 id="product-name">Loading…</h1>
          <p class="product-price" id="product-price"></p>
          <p class="product-desc" id="product-desc"></p>
        </div>

        <section class="colours-panel" aria-labelledby="colours-title">
          <h2 id="colours-title">Pick your colour</h2>
          <div class="colour-list" id="colour-list" role="group" aria-label="Choose a colour"></div>
        </section>

        <form class="order-form" id="order-form" novalidate>
          <p class="fit-summary" id="fit-summary"></p>
          <label class="phone-field">
            <span>Your phone number <span class="phone-hint">Let’s make it official</span></span>
            <input id="phone-input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX" required />
          </label>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button type="submit" class="button-order" id="order-button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.4-4.7a8.5 8.5 0 1 1 16.1-4.2Z" stroke="currentColor" stroke-width="1.6"/><path d="M8.1 7.5c.3-.3.7-.2.9.1l1 1.7c.2.3.1.6-.2.9l-.5.5c.6 1.2 1.5 2.1 2.8 2.7l.6-.7c.2-.3.6-.3.9-.1l1.7.8c.4.2.5.5.3.9-.4 1.2-1.3 1.6-2.4 1.3-3.2-.8-5.7-3.2-6.3-5.8-.2-.9.3-1.8 1.2-2.3Z" fill="currentColor"/></svg><span>Confirm &amp; order</span><span class="order-arrow" aria-hidden="true">↗</span></button>
          <p class="order-reassurance">Courier Rs. 250 · Review your order before sharing</p>
        </form>
      </section>
    </main>

    <dialog class="order-dialog" id="order-dialog" aria-labelledby="order-dialog-title">
      <div class="order-dialog-heading">
        <div><p>YOUR CUSTOM PAIR</p><h2 id="order-dialog-title">Ready to make it yours?</h2></div>
        <button class="dialog-close" id="close-order" type="button" aria-label="Close order preview">×</button>
      </div>
      <div class="order-card-preview"><img id="order-card-image" alt="Your order card with product, size, colour, heel height, phone, courier fee and total" /></div>
      <p class="share-note" id="share-note" role="status" aria-live="polite"></p>
      <div class="order-dialog-actions">
        <a class="save-order" id="save-order" download="venu-order.png">Save image ↓</a>
        <button class="button-order" id="share-order" type="button">Share order image ↗</button>
      </div>
    </dialog>

    <script src="cms-config.js"></script>
    <script src="product.js"></script>
  </body>
</html>
